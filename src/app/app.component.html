<div class="top-menu">

    <img class="logo"
         src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">

</div>

<button (click)="onCoursesEdited()">Edit</button>

<div class="courses" #container *ngIf="courses[0] as courseAAA">

  <ng-template #blankImage let-courseName="description">

    <p class="warn">{{courseName}} has no image yet.</p>

    <img src="/assets/empty-image.png">

  </ng-template>

  <course-card #cardRef1 (courseSelected)="onCourseSelected($event)" [course]="courseAAA"
   [noImageTpl]="blankImage">

    <course-image [src]="courseAAA.iconUrl"></course-image>

    <div class="course-description">
      {{courseAAA.longDescription}}
    </div>

    Edit Description: <textarea></textarea>

  </course-card>

  <!--<course-card #cardRef2 (courseSelected)="onCourseSelected($event)" [course]="courses[1]"/>-->

  <!--@for (course of courses; track course.id; let index = $index; let  first = $first) {

    <course-card (courseSelected)="onCourseSelected($event)" [course]="course" [index]="index"
    [class.is-first]="first"
    />
  } @empty {
    <h1>not found</h1>
  }-->


</div>
